name: Error
description: Algo no funciona como debería
labels: [bug]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué pasa
      description: Qué ves y qué esperabas ver.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Cómo reproducirlo
      placeholder: |
        1. Abro…
        2. Pulso…
  - type: input
    id: version
    attributes:
      label: Versión
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: log
    attributes:
      label: Log o captura
      description: Revisa que no salgan claves ni datos personales antes de pegarlo.
      render: text
